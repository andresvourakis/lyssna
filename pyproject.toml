[project]
name = "lyssna"
version = "0.3.1"
description = "Read any text aloud with a natural voice, and dictate into any app, on your Mac or PC."
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Andres Vourakis" }]
keywords = ["text-to-speech", "tts", "speech-to-text", "dictation", "macos", "windows", "menu-bar", "accessibility"]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Environment :: MacOS X",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    # The interface, on both systems: Qt through PySide6.
    "PySide6-Essentials>=6.10",
    "PySide6-Addons>=6.10",
    # The Mac's legacy AppKit interface (lyssna/legacy/) needs rumps until it is removed.
    "rumps>=0.4; sys_platform == 'darwin'",
    "httpx>=0.27",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-servicemanagement>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-security>=10; sys_platform == 'darwin'",
    # Windows: UI Automation for the selected text.
    "comtypes>=1.4; sys_platform == 'win32'",
    # The free voice that runs on this Mac (Kokoro-82M through onnxruntime, CPU only).
    "kokoro-onnx>=0.6.1,<0.7",
    # onnxruntime stopped publishing Intel Mac wheels after 1.23.2, so Intel Macs stay there.
    "onnxruntime>=1.24; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Dictation. Audio samples are numpy arrays (numpy also arrives through kokoro-onnx).
    "numpy>=1.26",
    # The local speech model (Parakeet TDT 0.6B) runs through onnx-asr on the onnxruntime above.
    "onnx-asr>=0.12,<0.13",
    # The local cleanup model (S1-mini by Superwhisper) runs through llama.cpp: with Metal on Apple
    # silicon, on the CPU on Windows x64; on Intel Macs dictation cleans up with rules alone.
    # Apple silicon: PyPI ships this version as
    # source only, so it is built on install, with Metal on and the deployment target at macOS 14
    # (a build on a newer macOS otherwise stamps every dylib with that version as its minimum and
    # the app would not load on macOS 14 or 15). The build settings are in
    # [tool.uv.extra-build-variables] below; by hand it is:
    #   MACOSX_DEPLOYMENT_TARGET=14.0 CMAKE_ARGS="-DGGML_METAL=on -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0" \
    #     uv pip install --no-binary llama-cpp-python "llama-cpp-python==0.3.37"
    "llama-cpp-python==0.3.37; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Windows x64: the prebuilt CPU wheel from llama-cpp-python's own index (PyPI has no Windows
    # wheel, and a source build needs a compiler the build machine should not depend on). That
    # index has wheels only, so Windows never builds it from source; 0.3.36 is its newest Windows
    # wheel. The index is set in [tool.uv.sources] below. jinja2 arrives with it.
    "llama-cpp-python==0.3.36; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.scripts]
lyssna = "lyssna.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lyssna"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
build = [
    "pyinstaller>=6.22",
]

[tool.uv.extra-build-variables]
llama-cpp-python = { MACOSX_DEPLOYMENT_TARGET = "14.0", CMAKE_ARGS = "-DGGML_METAL=on -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0" }

# Only llama-cpp-python on Windows comes from this index (explicit: nothing else is looked up
# there); on the Mac it comes from PyPI and is built with the variables above.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = [{ index = "llama-cpp-cpu", marker = "sys_platform == 'win32'" }]

[project]
name = "lyssna"
version = "0.3.1"
description = "Read any text on your Mac aloud with a natural voice, and dictate into any app."
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Andres Vourakis" }]
keywords = ["text-to-speech", "tts", "speech-to-text", "dictation", "macos", "menu-bar", "accessibility"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Environment :: MacOS X",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "rumps>=0.4",
    "httpx>=0.27",
    "pyobjc-framework-Cocoa>=10",
    "pyobjc-framework-AVFoundation>=10",
    "pyobjc-framework-Quartz>=10",
    "pyobjc-framework-ApplicationServices>=10",
    "pyobjc-framework-servicemanagement>=12.2.2",
    "pyobjc-framework-security>=10",
    # The free voice that runs on this Mac (Kokoro-82M through onnxruntime, CPU only).
    "kokoro-onnx>=0.6.1,<0.7",
    # onnxruntime stopped publishing Intel Mac wheels after 1.23.2, so Intel Macs stay there.
    "onnxruntime>=1.24; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Dictation. Audio samples are numpy arrays (numpy also arrives through kokoro-onnx).
    "numpy>=1.26",
    # The local speech model (Parakeet TDT 0.6B) runs through onnx-asr on the onnxruntime above.
    "onnx-asr>=0.12,<0.13",
    # The local cleanup model (S1-mini by Superwhisper) runs through llama.cpp with Metal, Apple
    # silicon only; on Intel Macs dictation cleans up with rules alone. PyPI ships this version as
    # source only, so it is built on install, with Metal on and the deployment target at macOS 14
    # (a build on a newer macOS otherwise stamps every dylib with that version as its minimum and
    # the app would not load on macOS 14 or 15). The build settings are in
    # [tool.uv.extra-build-variables] below; by hand it is:
    #   MACOSX_DEPLOYMENT_TARGET=14.0 CMAKE_ARGS="-DGGML_METAL=on -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0" \
    #     uv pip install --no-binary llama-cpp-python "llama-cpp-python==0.3.37"
    "llama-cpp-python==0.3.37; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
lyssna = "lyssna.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lyssna"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
build = [
    "pyinstaller>=6.22",
]

[tool.uv.extra-build-variables]
llama-cpp-python = { MACOSX_DEPLOYMENT_TARGET = "14.0", CMAKE_ARGS = "-DGGML_METAL=on -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0" }

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # PyObjC, AppKit and Quartz only exist on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uvx ruff check lyssna tests
      - run: uv run pytest -q

  test-windows:
    # The shared engine on Windows; tests that need the Mac frameworks skip themselves (tests/conftest.py).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uvx ruff check lyssna tests
      - run: uv run pytest -q

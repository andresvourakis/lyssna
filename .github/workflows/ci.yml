name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # PyObjC, AppKit and Quartz only exist on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uvx ruff check lyssna tests
      - run: uv run pytest -q

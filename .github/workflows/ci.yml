name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Everything: the engine, the Mac plumbing, the legacy AppKit interface (PyObjC, AppKit and
    # Quartz only exist on macOS) and the Qt interface, which its tests draw offscreen.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uvx ruff check lyssna tests
      - run: uv run pytest -q
      # The legacy AppKit interface in a process of its own, as the app never runs AppKit's
      # interface beside Qt's (tests/conftest.py leaves tests/legacy out of the run above).
      - run: uv run pytest -q tests/legacy

  test-windows:
    # The engine, the Windows plumbing and the Qt interface on Windows; tests that need the Mac
    # frameworks (tests/legacy/ and a few more) are skipped there (tests/conftest.py).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uvx ruff check lyssna tests
      - run: uv run pytest -q
